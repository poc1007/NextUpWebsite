<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support inbox · NextUp</title><link rel="stylesheet" href="../assets/site.css"></head><body>
<header class="site-header"><div class="header-content"><a class="brand" href="../"><span class="brand-mark">✦</span>NextUp</a><nav><a href="../privacy/">Privacy</a><a href="../support/">Support</a></nav></div></header>
<main class="content"><p class="eyebrow">Private area</p><h1>Support inbox</h1><section id="login-card" class="card"><p>Sign in with your own NextUp account to access support requests.</p><form id="login-form"><label>Email<input required name="email" type="email" autocomplete="username"></label><label>Password<input required name="password" type="password" autocomplete="current-password"></label><button class="button">Sign in</button><p id="login-result" class="hint" aria-live="polite"></p></form></section><section id="inbox" class="card hidden"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><h2 style="margin:0">Messages</h2><button id="sign-out" class="button secondary">Sign out</button></div><p id="inbox-result" class="hint"></p><div id="message-list"></div></section></main>
<footer class="site-footer"><div class="footer-content"><span>NextUp</span><span>Private support inbox</span></div></footer><script src="../assets/config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient(NextUpSupportConfig.supabaseUrl,NextUpSupportConfig.publishableKey),loginCard=document.querySelector('#login-card'),inbox=document.querySelector('#inbox'),loginResult=document.querySelector('#login-result'),list=document.querySelector('#message-list'),inboxResult=document.querySelector('#inbox-result');const escape=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));async function load(){const {data,error}=await supabase.from('support_inbox').select('*').order('created_at',{ascending:false});if(error){inboxResult.textContent='This account is not authorised to view the support inbox.';inboxResult.className='error';return;}inboxResult.textContent=data.length?`${data.length} request${data.length===1?'':'s'}.`:'No support requests yet.';list.innerHTML=data.map(item=>`<article class="inbox-item"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${escape(item.subject)}</h3><p class="meta">${escape(item.name)}${item.reply_email?` · ${escape(item.reply_email)`:''} · ${new Date(item.created_at).toLocaleString()}</p></div><select class="status" data-id="${item.id}"><option value="new" ${item.status==='new'?'selected':''}>New</option><option value="in_progress" ${item.status==='in_progress'?'selected':''}>In progress</option><option value="resolved" ${item.status==='resolved'?'selected':''}>Resolved</option></select></div><p class="message">${escape(item.message)}</p>${item.expected_result?`<p><strong>Expected:</strong> ${escape(item.expected_result)}</p>`:''}${item.actual_result?`<p><strong>Actual:</strong> ${escape(item.actual_result)}</p>`:''}${item.error_message?`<p><strong>Error:</strong> ${escape(item.error_message)}</p>`:''}<p class="meta">${escape(item.category)}${item.device_model?` · ${escape(item.device_model)`:''}${item.ios_version?` · ${escape(item.ios_version)`:''}${item.screen?` · ${escape(item.screen)`:''}</p></article>`).join('');document.querySelectorAll('.status').forEach(select=>select.addEventListener('change',async()=>{await supabase.from('support_inbox').update({status:select.value,updated_at:new Date().toISOString()}).eq('id',select.dataset.id);}));}async function session(){const {data:{session}}=await supabase.auth.getSession();if(session){loginCard.classList.add('hidden');inbox.classList.remove('hidden');await load();}}document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target)),{error}=await supabase.auth.signInWithPassword({email:values.email,password:values.password});if(error){loginResult.textContent='Sign-in failed.';loginResult.className='error';return;}await session();});document.querySelector('#sign-out').addEventListener('click',async()=>{await supabase.auth.signOut();inbox.classList.add('hidden');loginCard.classList.remove('hidden');list.innerHTML='';});await session();
</script></body></html>
